name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # 仓库中大量题解是共用 package main 的单文件，无法整体 go build / go vet，
      # 因此只检查模板包
      - name: Build
        run: go build ./copypasta ./copypasta/treap/...

      - name: Vet
        run: go vet ./copypasta ./copypasta/treap/...

      - name: Test copypasta templates
        run: go test -count=1 -timeout 120s -race ./copypasta ./copypasta/treap/...
